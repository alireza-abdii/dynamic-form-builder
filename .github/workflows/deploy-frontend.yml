name: Deploy Frontend (Cloudflare Pages / GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Forms & Generate Registry
        run: |
          npm run forms:validate
          npm run forms:sync

      - name: Build Frontend Application
        env:
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}
          VITE_PUBLIC_BASE_URL: ${{ secrets.VITE_PUBLIC_BASE_URL }}
          VITE_BOT_USERNAME: ${{ secrets.VITE_BOT_USERNAME }}
          VITE_TMA_SHORTNAME: ${{ secrets.VITE_TMA_SHORTNAME }}
        run: npm run build -w frontend

      # Deploy option A: Cloudflare Pages (if CLOUDFLARE_API_TOKEN is provided)
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=form-builder

      # Deploy option B: GitHub Pages (default fallback)
      - name: Setup Pages Artifact (GitHub Pages)
        if: env.CLOUDFLARE_API_TOKEN == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        if: env.CLOUDFLARE_API_TOKEN == ''
        id: deployment
        uses: actions/deploy-pages@v4
